[package]
name = "zellij-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server exposing the Zellij remote-control WebSocket API as tools"
license.workspace = true

[dependencies]
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
axum = { version = "0.8" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
anyhow = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
# `read_image` drives Zellij's own web UI in a headless browser rather than
# reimplementing terminal rendering here — see `web_capture.rs`.
# No `fetcher` feature: that exists to DOWNLOAD a Chrome build, and this
# machine already has one. Pulling it in also drags a zip/TLS stack into a
# server whose job is to take screenshots.
chromiumoxide = { version = "0.9", default-features = false }
base64 = "0.22"

[[bin]]
name = "zellij-mcp"
path = "src/main.rs"

[dev-dependencies]
rmcp = { version = "3.1", default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
] }
tempfile = "3"
